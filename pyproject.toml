[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "promptrunner"
version = "2026.05.06"
requires-python = ">=3.12"
authors = [
    {name = "Artur Kulmizev", email = "akulmizev@proton.me"},
]
maintainers = [
    {name = "Artur Kulmizev", email = "akulmizev@proton.me"},
]
description = "A simple toolkit for prompting LLMs across different backends and APIs."
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"]
dependencies = [
    "anthropic",
    "google-genai",
    "litellm",
    "ollama",
    "together"
]

[project.urls]
"Homepage" = "https://github.com/akulmizev/PromptRunner"

[tool.setuptools.packages.find]
where = ["src"]
